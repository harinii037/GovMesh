spring.application.name=govmesh

server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/govmesh}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Development-only secret. Use an environment variable in the final deployment.
jwt.secret=${JWT_SECRET:VGovMeshDevelopmentSecretKeyForHmacSha256SigningOnly1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
